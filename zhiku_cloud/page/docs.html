<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档管理 · 掌柜智库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f4f7fa; padding: 22px; }
    .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .head h2 { color: #0b1f33; font-size: 18px; }
    .btn { border: none; cursor: pointer; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; }
    .btn-blue { background: #12b0a4; color: #fff; }
    .btn-blue:hover { background: #0fa79b; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.06); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #f7f8fa; color: #555; text-align: left; padding: 11px 14px; font-weight: 600; }
    td { padding: 11px 14px; border-top: 1px solid #f0f0f0; color: #333; }
    tr:hover td { background: #f7fbfa; }
    .status { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; }
    .s-completed { background: #e6f7ee; color: #0a7a43; }
    .s-processing { background: #fff6e6; color: #b26a00; }
    .s-failed { background: #ffecec; color: #c0392b; }
    .del { border: none; cursor: pointer; background: #ffecec; color: #c0392b; padding: 5px 12px; border-radius: 6px; font-size: 12px; }
    .del:hover { background: #ffd6d3; }
    .empty { text-align: center; padding: 40px; color: #999; }
    .meta { color: #888; font-size: 12px; margin-top: 6px; }
    .meta b { color: #0a7a43; }
  </style>
</head>
<body>
  <div class="head">
    <h2>📁 我的文档库</h2>
    <button class="btn btn-blue" onclick="load()">↻ 刷新</button>
  </div>
  <div class="card">
    <table>
      <thead>
        <tr><th style="width:36%">文件名</th><th>状态</th><th>向量块数</th><th>上传时间</th><th>操作</th></tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
  <p class="meta">删除操作会同时清理：Milvus 向量 ✓ / MinIO 原文件 ✓ / 数据库记录 ✓　|　当前用户：<b id="who">…</b></p>

<script>
const $ = id => document.getElementById(id);

async function load() {
  const tk = localStorage.getItem('kb_token') || '';
  try {
    const [r1, r2] = await Promise.all([
      fetch('/api/docs/list', { headers: { Authorization: 'Bearer ' + tk, 'X-Auth-Token': tk } }),
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + tk, 'X-Auth-Token': tk } })
    ]);
    const j = await r1.json();
    const m = await r2.json();
    if (m.ok) $('who').textContent = m.user.nickname;
    if (!j.ok) { $('tbody').innerHTML = '<tr><td colspan="5" class="empty">' + (j.message || '加载失败') + '</td></tr>'; return; }
    const docs = j.documents || [];
    if (!docs.length) { $('tbody').innerHTML = '<tr><td colspan="5" class="empty">还没有导入过文档，去「📥 知识库导入」上传吧</td></tr>'; return; }
    $('tbody').innerHTML = docs.map(d => {
      const cls = d.status === 'completed' ? 's-completed' : d.status === 'failed' ? 's-failed' : 's-processing';
      const st = d.status === 'completed' ? '✅ 已完成' : d.status === 'failed' ? '❌ 失败' : '⏳ 处理中';
      return '<tr>' +
        '<td title="' + (d.error || '') + '">' + escapeHtml(d.file_name || '') + '</td>' +
        '<td><span class="status ' + cls + '">' + st + '</span></td>' +
        '<td>' + (d.chunk_count != null ? d.chunk_count : '—') + '</td>' +
        '<td>' + (d.created_at || '') + '</td>' +
        '<td><button class="del" onclick="del(\'' + d.task_id + '\')">删除</button></td>' +
        '</tr>';
    }).join('');
  } catch (e) {
    $('tbody').innerHTML = '<tr><td colspan="5" class="empty">网络异常</td></tr>';
  }
}

async function del(taskId) {
  if (!confirm('确定删除该文档？将同时清理 Milvus 向量、MinIO 原文件与数据库记录，不可恢复！')) return;
  const tk = localStorage.getItem('kb_token') || '';
  const r = await fetch('/api/docs/' + taskId, { method: 'DELETE', headers: { Authorization: 'Bearer ' + tk, 'X-Auth-Token': tk } });
  const j = await r.json();
  alert(j.message || (j.ok ? '已删除' : '删除失败'));
  load();
}

function escapeHtml(t) { return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

load();
</script>
</body>
</html>
